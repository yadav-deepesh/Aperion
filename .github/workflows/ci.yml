name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 1.26.7 }
      - name: go vet
        working-directory: orchestrator
        run: go vet ./...
      - uses: actions/setup-python@v5
        with: { python-version: 3.14.7 }
      - name: ruff
        run: ruff check services/ || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 1.26.7 }
      - name: go test race
        working-directory: orchestrator
        run: go test -race ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 1.26.7 }
      - name: fuzz SlewTime 30s
        working-directory: orchestrator
        run: go test -run=NONE -fuzz=FuzzSlewTime -fuzztime=30s ./internal/scheduler/
      - name: fuzz AzDelta 30s
        working-directory: orchestrator
        run: go test -run=NONE -fuzz=FuzzAzDelta -fuzztime=30s ./internal/scheduler/

  tla-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: fetch TLC
        run: curl -sSL -o spec/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: TLA syntax check
        # SANY resolves the module by file name, so it must run inside spec/
        working-directory: spec
        run: |
          set -euo pipefail
          java -cp tla2tools.jar tla2sany.SANY SchedulerProtocol.tla
      - name: TLC bounded model
        working-directory: spec
        run: |
          set -euo pipefail
          java -cp tla2tools.jar tlc2.TLC \
            -workers 2 \
            -config SchedulerProtocol.cfg \
            SchedulerProtocol.tla

  # End-to-end: boots the deploy lane, gates on health, then exercises the
  # demo-critical routes on a fresh DB. The byte-identical golden diff lands
  # with the export lane; until then smoke.sh asserts valid response shapes.
  integration:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: compose up
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: health gate
        run: bash scripts/health_all.sh
      - name: smoke routes
        run: bash scripts/smoke.sh
      - name: compose down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
