services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: aperion
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: aperion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperion -d aperion"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  orchestrator:
    build:
      context: ../orchestrator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aperion:localdev@postgres:5432/aperion?sslmode=disable
      PORT: "8080"
      RUST_ENGINE_ADDR: engine:50051
      SKYFIELD_ADDR: http://skyfield_svc:50052
      RAIN_ADDR: http://rain_svc:50053
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  engine:
    build:
      context: ../engine
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:50051/health || nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  skyfield_svc:
    build:
      context: ../services/skyfield_svc
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:50052/health', timeout=2).read()\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rain_svc:
    build:
      context: ../services/rain_svc
      dockerfile: Dockerfile
    ports:
      - "50053:50053"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:50053/health', timeout=2).read()\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
