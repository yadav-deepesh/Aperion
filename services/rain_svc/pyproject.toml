[project]
name = "rain-svc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Poorab", email = "poorab2309@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "itur>=0.4.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[project.scripts]
rain-svc = "rain_svc:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
